name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest PyYAML

      - name: Compile Python
        run: |
          python -m compileall -q src
          python -m py_compile scripts/blender_bridge.py

      - name: Import MCP server and full entrypoint
        env:
          PYTHONPATH: src
          VIDEO_MCP_DATA_ROOT: /tmp/video-mcp-import-guard
        run: |
          rm -rf "$VIDEO_MCP_DATA_ROOT"
          python -c "import video_mcp.server"
          python -c "import video_mcp.entrypoint"
          test ! -e "$VIDEO_MCP_DATA_ROOT"

      - name: Unit and release-contract tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Validate public-repository safety
        run: python scripts/check_public_repo.py

      - name: Validate YAML
        run: python -c "import yaml; yaml.safe_load(open('video-mcp.yml', encoding='utf-8'))"

      - name: Validate shell syntax
        run: |
          /bin/sh -n scripts/start.sh
          /bin/sh -n scripts/prepare_media_tools.sh

      - name: Validate Compose model
        env:
          CLOUDFLARED_TUNNEL_TOKEN: x
        run: docker compose -f video-mcp.yml config >/dev/null

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "## [$VERSION]" CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create immutable stable release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to mutate an existing release."
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
